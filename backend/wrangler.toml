name = "tri-thuc-game-api"
main = "src/index.js"
compatibility_date = "2026-11-10"

[[d1_databases]]
binding = "DB"
database_name = "tri-thuc-game"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomHub"]

[vars]
ALLOWED_ORIGIN = "https://lephamhaiyen2-spec.github.io"
